<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#1f242c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe6f2"/>
      <stop offset="1" stop-color="#6fb8d3"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (safe for maskable icons) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- glass pane in an aluminium frame -->
  <rect x="116" y="96" width="280" height="250" rx="14" fill="#c9ced6"/>
  <rect x="134" y="114" width="244" height="214" rx="4" fill="url(#glass)"/>
  <!-- reflections -->
  <polygon points="160,114 214,114 134,212 134,146" fill="#ffffff" opacity="0.45"/>
  <polygon points="236,114 256,114 134,262 134,238" fill="#ffffff" opacity="0.30"/>

  <!-- fraction on the glass -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" fill="#1f242c" text-anchor="middle">
    <text x="300" y="214" font-size="58">3</text>
    <rect x="270" y="226" width="60" height="7" rx="3"/>
    <text x="300" y="292" font-size="58">4</text>
  </g>

  <!-- tape-measure ruler -->
  <rect x="96" y="358" width="320" height="64" rx="10" fill="#f2b632"/>
  <g stroke="#1f242c" stroke-width="5" stroke-linecap="round">
    <line x1="128" y1="358" x2="128" y2="400"/>
    <line x1="160" y1="358" x2="160" y2="376"/>
    <line x1="192" y1="358" x2="192" y2="386"/>
    <line x1="224" y1="358" x2="224" y2="376"/>
    <line x1="256" y1="358" x2="256" y2="400"/>
    <line x1="288" y1="358" x2="288" y2="376"/>
    <line x1="320" y1="358" x2="320" y2="386"/>
    <line x1="352" y1="358" x2="352" y2="376"/>
    <line x1="384" y1="358" x2="384" y2="400"/>
  </g>
</svg>
